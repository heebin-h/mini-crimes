name: Deploy Client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # node --test 경로 글롭은 Node ≥21
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: client

      # 회귀 차단: lint·단위 테스트 실패 시 배포하지 않음 (P2P E2E는 공용 PeerJS 서버 의존이라 로컬 실행: npm run e2e)
      - name: Lint
        run: npm run lint
        working-directory: client

      - name: Unit test
        run: npm test
        working-directory: client

      # 정적 사이트 — 서버 주소 불필요. 팀 수사는 P2P(PeerJS 공용 시그널링, VITE_PEER_* 로 교체 가능)
      - name: Build
        run: npm run build
        working-directory: client
        env:
          VITE_BASE: ${{ secrets.VITE_BASE || '/mini-crimes/' }}

      # SPA 라우팅: 404.html = index.html
      - name: Copy index.html to 404.html
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
